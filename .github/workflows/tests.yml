name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            illuminate: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            illuminate: '^13.0'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies --with=illuminate/database:${{ matrix.illuminate }} --with=illuminate/support:${{ matrix.illuminate }} --with=orchestra/testbench:${{ matrix.testbench }}

      - run: vendor/bin/pint --test
      - run: vendor/bin/pest --ci
